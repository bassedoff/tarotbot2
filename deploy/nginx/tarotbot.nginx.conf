# Nginx configuration for Tarot Bot
# Place this file in /etc/nginx/sites-available/tarotbot
# Create symlink: ln -s /etc/nginx/sites-available/tarotbot /etc/nginx/sites-enabled/

upstream tarotbot_backend {
    server 127.0.0.1:5000 fail_timeout=0;
}

server {
    listen 80;
    server_name 5.129.196.58;

    # SSL certificates (managed by certbot) - Disabled for IP-based access
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/tarotbot_access.log;
    error_log /var/log/nginx/tarotbot_error.log;

    # Root directory for static files
    root /opt/tarotbot;

    # Client body size limit (for file uploads in support)
    client_max_body_size 10M;

    # Health check endpoint
    location /health {
        proxy_pass http://tarotbot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Webhook and API endpoints
    location ~ ^/(webhook|get_user_data|save_user_data|debug|get_recent_readings) {
        proxy_pass http://tarotbot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve images from the images folder
    location /images/ {
        alias /opt/tarotbot/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve miniapp.html (Telegram Web App)
    location /miniapp.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Serve static assets (if any)
    location /static/ {
        alias /opt/tarotbot/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|json|py|pyc|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
