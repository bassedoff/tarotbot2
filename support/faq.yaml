categories:
  - title: "Оплата и подписка"
    description: "Вопросы об оплате, подписках и лимитах"
    questions:
      - title: "Как оплатить подписку?"
        body: "Вы можете оплатить подписку через нашего бота. Перейдите в раздел 'Подписка' и выберите подходящий тариф. Оплата производится через ЮKassa."
      
      - title: "Можно ли получить бесплатные расклады?"
        body: "Да, каждый новый пользователь получает 1 бесплатный расклад при первом использовании. После этого расклады можно приобрести отдельно или оформить подписку."
      
      - title: "Как отменить подписку?"
        body: "Подписка отменяется автоматически в конце оплаченного периода. Продление происходит только при желании пользователя."

  - title: "Работа с мини-приложением"
    description: "Проблемы с мини-приложением и его функциями"
    questions:
      - title: "Мини-приложение не открывается"
        body: "Попробуйте перезапустить Telegram. Если проблема сохраняется, убедитесь, что у вас установлена последняя версия приложения."
      
      - title: "Не отображаются карты"
        body: "Проверьте подключение к интернету. Если проблема сохраняется, попробуйте очистить кэш Telegram и перезапустить приложение."
      
      - title: "Как сохранить расклад?"
        body: "Все расклады автоматически сохраняются в вашем профиле. Вы можете найти их в разделе 'История' в мини-приложении."

  - title: "Технические вопросы"
    description: "Технические проблемы и ошибки"
    questions:
      - title: "Бот не отвечает"
        body: "Попробуйте перезапустить бота командой /start. Если проблема сохраняется, возможно, ведутся технические работы."
      
      - title: "Ошибка при формировании расклада"
        body: "Попробуйте повторить запрос. Если ошибка повторяется, свяжитесь с нашей службой поддержки через кнопку 'Спросить'."
      
      - title: "Не приходят уведомления"
        body: "Проверьте настройки уведомлений в Telegram. Убедитесь, что уведомления от бота включены в настройках чата."